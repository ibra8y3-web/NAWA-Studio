<rect x="825" y="120" width="320" height="105" rx="14" fill="#302b62" stroke="#988eff"/><text x="985" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#f0edff">Project Repository</text><text x="985" y="178" text-anchor="middle" font-size="12" fill="#d0cbff">Files · revisions · imports / exports</text><text x="985" y="198" text-anchor="middle" font-size="12" fill="#d0cbff">Local project persistence</text>
