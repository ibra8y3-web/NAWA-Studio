<rect x="660" y="310" width="430" height="130" rx="14" fill="#3d3045" stroke="#d49ad6"/><text x="875" y="346" text-anchor="middle" font-size="18" font-weight="700" fill="#fff0ff">Android Project Generator</text><text x="875" y="373" text-anchor="middle" font-size="12" fill="#efd1ef">Compose source · Gradle project files</text><text x="875" y="396" text-anchor="middle" font-size="12" fill="#efd1ef">Supported screens and controls only</text><text x="875" y="417" text-anchor="middle" font-size="11" fill="#d5a9da">NawaAndroidProjectGenerator.kt</text>
