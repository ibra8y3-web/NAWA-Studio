<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">NAWA Studio architecture map</title><desc id="desc">Architecture diagram mapping Android UI, editor, project repository, NawaScript parser, generator, and CI build pipeline.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#172740"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6fdccf"/></marker></defs><rect width="1200" height="670" rx="24" fill="url(#bg)"/><text x="45" y="52" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f5f8ff">NAWA Studio · Architecture Map</text><text x="45" y="78" font-family="Arial,sans-serif" font-size="13" fill="#aebdd8">Current source layout · boundaries are conceptual, not a fully isolated plugin architecture</text>
<g font-family="Arial,sans-serif"><rect x="55" y="120" width="320" height="105" rx="14" fill="#203251" stroke="#6184b8"/><text x="215" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#eff5ff">Android UI</text><text x="215" y="178" text-anchor="middle" font-size="12" fill="#c2d3ee">Kotlin · Jetpack Compose</text><text x="215" y="198" text-anchor="middle" font-size="12" fill="#c2d3ee">MainActivity + editor screens</text>
