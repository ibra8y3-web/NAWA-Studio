<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">NAWA Studio CI build pipeline</title><desc id="desc">The GitHub Actions pipeline from pushing source through Gradle tests and APK verification to artifact upload.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b1427"/><stop offset="1" stop-color="#152a3b"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79e0d0"/></marker></defs><rect width="1200" height="300" rx="22" fill="url(#bg)"/><text x="38" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f4f7ff">Automated APK Build · GitHub Actions</text><text x="38" y="67" font-family="Arial,sans-serif" font-size="12" fill="#9eb0ce">Runs on push to main/master or manual workflow dispatch</text>
<g font-family="Arial,sans-serif"><rect x="35" y="105" width="205" height="112" rx="13" fill="#20304c" stroke="#6c8cbd"/><text x="137" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#eff5ff">1 · Trigger</text><text x="137" y="164" text-anchor="middle" font-size="12" fill="#c4d4ef">Push / Run workflow</text><text x="137" y="185" text-anchor="middle" font-size="11" fill="#9fb3d6">Checkout source</text>
<rect x="275" y="105" width="205" height="112" rx="13" fill="#16413f" stroke="#4ecdbd"/><text x="377" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#e8fffc">2 · Toolchain</text><text x="377" y="164" text-anchor="middle" font-size="12" fill="#b5eee5">JDK 17 · Gradle 8.13</text><text x="377" y="185" text-anchor="middle" font-size="11" fill="#8bd8cd">Android SDK 35</text>
<rect x="515" y="105" width="205" height="112" rx="13" fill="#302d60" stroke="#9588f7"/><text x="617" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#f0edff">3 · Test + Build</text><text x="617" y="164" text-anchor="middle" font-size="12" fill="#d2ccff">testDebugUnitTest</text><text x="617" y="185" text-anchor="middle" font-size="12" fill="#d2ccff">assembleDebug</text>
<rect x="755" y="105" width="205" height="112" rx="13" fill="#4a3540" stroke="#d99aae"/><text x="857" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#fff0f4">4 · Verify</text><text x="857" y="164" text-anchor="middle" font-size="12" fill="#f1d6e0">Check APK exists</text><text x="857" y="185" text-anchor="middle" font-size="12" fill="#f1d6e0">Verify signature</text>
<rect x="995" y="105" width="170" height="112" rx="13" fill="#193f50" stroke="#5cc8e2"/><text x="1080" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#e9fbff">5 · Artifact</text><text x="1080" y="164" text-anchor="middle" font-size="12" fill="#c5e7f3">Upload APK</text><text x="1080" y="185" text-anchor="middle" font-size="11" fill="#94d2e5">Actions → Artifacts</text>
<path d="M240 161H267M480 161H507M720 161H747M960 161H987" fill="none" stroke="#79e0d0" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="600" y="257" text-anchor="middle" font-size="12" fill="#aabbd6">A green workflow means the pipeline passed; it does not replace installing and testing on a real device.</text></g></svg>
